name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      # 只做「能不能构建出来」的校验；dist 由本地/发布流程产出，不走 CI
      - name: Build check
        run: pnpm build
